<?xml version="1.0" encoding="UTF-8"?>
<!--
  architecture.svg — RabTech Academy Task 02
  System Architecture Diagram
  Scope: LAB-01 (127.0.0.1:8080) and LAB-02 (192.168.56.20)
  No external dependencies. No JavaScript. No remote resources.
-->
<svg
