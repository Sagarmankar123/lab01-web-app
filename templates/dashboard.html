{% extends "base.html" %}
{% block content %}
<h1>Dashboard</h1>
<p>Welcome, {{ user['username'] }} (role: {{ user['role'] }}).</p>
<p>Your profile: <a href="{{ url_for('profile', user_id=user['user_id']) }}">view</a></p>
<p>Try viewing other profile IDs directly, e.g.
  <a href="{{ url_for('profile', user_id=1) }}">/profile/1</a>,
  <a href="{{ url_for('profile', user_id=2) }}">/profile/2</a>,
  <a href="{{ url_for('profile', user_id=3) }}">/profile/3</a>.
</p>
{% endblock %}
