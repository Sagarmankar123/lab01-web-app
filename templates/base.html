<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LAB-01 training app</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; color: #222; }
    nav a { margin-right: 14px; }
    .banner { background: #fdecea; border: 1px solid #c0392b; padding: 10px 14px; margin-bottom: 20px; font-size: 13px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 14px; }
    th { background: #f0f0f0; }
    input, textarea { padding: 6px; width: 260px; margin-bottom: 8px; }
    button { padding: 6px 14px; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <div class="banner">LAB-01 -- intentionally vulnerable training app. Authorized lab use only.</div>
  <nav>
    <a href="{{ url_for('home') }}">Home</a>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('search') }}">Search</a>
    <a href="{{ url_for('comments') }}">Comments</a>
    <a href="{{ url_for('admin') }}">Admin</a>
    {% if session.get('username') %}
      <a href="{{ url_for('logout') }}">Logout ({{ session['username'] }})</a>
    {% else %}
      <a href="{{ url_for('login') }}">Login</a>
    {% endif %}
  </nav>
  <hr>
  {% block content %}{% endblock %}
</body>
</html>
