<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LAB-01 training app</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="banner"><strong>LAB-01</strong> -- intentionally vulnerable training app. Authorized lab use only.</div>
  
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="dot"></div>
        LAB-01
      </div>
      <nav class="links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('search') }}">Search</a>
        <a href="{{ url_for('comments') }}">Comments</a>
        <a href="{{ url_for('admin') }}">Admin</a>
        {% if session.get('username') %}
          <a href="{{ url_for('logout') }}" class="session">Logout ({{ session['username'] }})</a>
        {% else %}
          <a href="{{ url_for('login') }}">Login</a>
        {% endif %}
      </nav>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="foot">
      RabTech Academy &mdash; Task 02
    </footer>
  </div>
</body>
</html>
