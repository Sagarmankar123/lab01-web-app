{% extends "base.html" %}
{% block content %}
<h1>Search</h1>
<form method="get">
  <input type="text" name="q" placeholder="Search notes and comments..." value="{{ query }}">
  <button type="submit">Search</button>
</form>
{% if query %}
  <p>Search results for: {{ query|safe }}</p>
  <p>(No backend search is implemented -- this page only reflects your query back, unescaped.)</p>
{% endif %}
{% endblock %}
