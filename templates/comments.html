{% extends "base.html" %}
{% block content %}
<h1>Comments</h1>
<form method="post">
  <div><input type="text" name="author" placeholder="Your name"></div>
  <div><textarea name="content" placeholder="Comment"></textarea></div>
  <button type="submit">Post</button>
</form>
<hr>
{% for c in comments %}
  <p><strong>{{ c['author'] }}:</strong> {{ c['content']|safe }}</p>
{% endfor %}
{% endblock %}
