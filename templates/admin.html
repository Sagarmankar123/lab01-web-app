{% extends "base.html" %}
{% block content %}
<h1>Admin panel</h1>
<p class="error">This page only checks that you are logged in, not that your role is admin.</p>
<table>
  <tr><th>ID</th><th>Username</th><th>Password</th><th>Role</th><th>Email</th></tr>
  {% for u in users %}
  <tr>
    <td>{{ u['id'] }}</td>
    <td>{{ u['username'] }}</td>
    <td>{{ u['password'] }}</td>
    <td>{{ u['role'] }}</td>
    <td>{{ u['email'] }}</td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
